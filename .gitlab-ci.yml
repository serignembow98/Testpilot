# Pipeline GitLab CI/CD — TestPilot
# Principe : aucun merge si les tests échouent ou si la couverture passe sous le seuil (quality gate).

stages:
  - test
  - quality
  - package

default:
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

# ---------- Backend : tests unitaires + intégration + seuil JaCoCo ----------
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]
  script:
    - cd backend
    # 'verify' exécute les tests puis la règle JaCoCo : le job échoue sous les seuils du pom.xml
    - mvn $MAVEN_CLI_OPTS verify
    # Affiche la couverture de lignes pour que GitLab la capture (regex ci-dessous)
    - awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "Line coverage: %.1f%%\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv
  coverage: '/Line coverage: (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/target/site/jacoco/
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml

# ---------- Frontend : typage + tests + seuil de couverture ----------
frontend:test:
  stage: test
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/.npm/]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    # Échoue si la couverture passe sous les seuils définis dans vite.config.ts
    - npm run test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/coverage/

# ---------- Analyse statique (optionnelle : active uniquement si SonarQube est configuré) ----------
sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  needs: ["backend:test"]
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.token=$SONAR_TOKEN
        -Dsonar.projectKey=testpilot-api
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  allow_failure: true

# ---------- Images Docker (branche par défaut uniquement) ----------
.docker-build:
  stage: package
  image: docker:27
  services: ["docker:27-dind"]
  needs: ["backend:test", "frontend:test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

package:backend:
  extends: .docker-build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA

package:frontend:
  extends: .docker-build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
